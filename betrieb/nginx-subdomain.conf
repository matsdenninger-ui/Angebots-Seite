# Variante B: Die Partnerseite bekommt eine eigene Adresse,
# z. B. partner.gwb-wohnungsbau.de
#
# Zertifikat davor: sudo certbot --nginx -d partner.gwb-wohnungsbau.de

server {
    listen 80;
    listen [::]:80;
    server_name partner.gwb-wohnungsbau.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner.gwb-wohnungsbau.de;

    ssl_certificate     /etc/letsencrypt/live/partner.gwb-wohnungsbau.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner.gwb-wohnungsbau.de/privkey.pem;

    client_max_body_size 60m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
