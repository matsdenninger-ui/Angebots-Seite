# Variante A: Die Partnerseite hängt unter gwb-wohnungsbau.de/partner/
#
# In den bestehenden server-Block der Hauptseite einfügen. Alles andere an der
# Website bleibt, wie es ist — nur dieser eine Pfad geht an die Partnerseite.

# Ohne Schrägstrich am Ende wären die Verweise auf styles.css und app.js
# eine Ebene zu hoch. Deshalb umleiten.
location = /partner {
    return 301 /partner/;
}

location /partner/ {
    proxy_pass         http://127.0.0.1:3000/;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Anlagen: fünf Dateien à 10 MB plus Formularfelder.
    client_max_body_size 60m;
    proxy_read_timeout   120s;
}
